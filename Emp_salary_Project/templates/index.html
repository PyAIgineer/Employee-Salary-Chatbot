<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Information Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container-fluid main-content">
        <div class="row">
            <!-- Sidebar Panel -->
            <div class="col-md-3 bg-light p-4 sidebar">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h3>Employee Salary Assistant</h3>
                    <button id="logout-btn" class="btn btn-sm btn-outline-secondary">Logout</button>
                </div>
                
                <!-- Document Upload Section -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Document Upload</h5>
                    </div>
                    <div class="card-body">
                        <form id="upload-form" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="document" class="form-label">Upload Salary Document</label>
                                <input type="file" class="form-control" id="document" accept=".pdf,.csv,.txt">
                                <div class="form-text">Supported formats: PDF, CSV, TXT</div>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Upload</button>
                        </form>
                        <div id="upload-status" class="mt-2"></div>
                    </div>
                </div>
                
                <!-- Document Search Section -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Search Documents</h5>
                    </div>
                    <div class="card-body">
                        <form id="query-form">
                            <div class="mb-3">
                                <label for="query" class="form-label">Search Documents</label>
                                <input type="text" class="form-control" id="query" placeholder="Enter search query">
                            </div>
                            <button type="submit" class="btn btn-info w-100">Search</button>
                        </form>
                    </div>
                </div>
                
                <button id="clear-history" class="btn btn-secondary w-100 mt-3">Clear Chat History</button>
            </div>
            
            <!-- Chat Panel -->
            <div class="col-md-9 chat-container">
                <div class="chat-header">
                    <h2>Salary Information Assistant</h2>
                </div>
                <div id="chat-messages" class="chat-messages">
                    <div class="message system">
                        Welcome to Salary Information Assistant! You can ask questions about your salary, deductions, and leave balance.
                    </div>
                </div>
                <div class="chat-input-container">
                    <form id="chat-form">
                        <div class="input-group">
                            <input type="text" id="user-input" class="form-control" placeholder="Ask about your salary, deductions, or leave balance...">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
